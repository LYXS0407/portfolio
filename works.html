              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 瀑布流：纯图片展示 -->

      <div class="container">
        <div class="waterfall" id="worksWaterfall">
          <!-- 作品图片由 JS 依据 site-data 渲染，后续可接入后台 -->
        </div>

  <!-- ==================== 作品放大查看（灯箱） ==================== -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <button class="lightbox-btn lightbox-close" id="lightboxClose" type="button" aria-label="关闭">×</button>
    <button class="lightbox-btn lightbox-prev" id="lightboxPrev" type="button" aria-label="上一张">‹</button>
    <figure class="lightbox-figure">
      <img id="lightboxImg" src="" alt="" draggable="false">
    </figure>
    <button class="lightbox-btn lightbox-next" id="lightboxNext" type="button" aria-label="下一张">›</button>
    <div class="lightbox-zoom">
      <button class="lightbox-btn lightbox-zoom-in" id="lightboxZoomIn" type="button" aria-label="放大">+</button>
      <button class="lightbox-btn lightbox-zoom-out" id="lightboxZoomOut" type="button" aria-label="缩小">−</button>
    </div>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>
